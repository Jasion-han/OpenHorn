services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./data:/app/data
      - ./attachments:/app/attachments
    environment:
      - DATABASE_URL=file:/app/data/openhorn.db
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_ENV=production
      - PORT=3002
      # Optional provider keys (pass-through from host env / .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_OAUTH_TOKEN=${ANTHROPIC_OAUTH_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Optional OpenRouter decision assistance, separate from chat model channels
      - OPENHORN_JEV_API_KEY=${OPENHORN_JEV_API_KEY:-}
      - OPENHORN_JEV_ENABLED=${OPENHORN_JEV_ENABLED:-false}
      - OPENHORN_JEV_DAILY_BUDGET_USD=${OPENHORN_JEV_DAILY_BUDGET_USD:-0.05}
