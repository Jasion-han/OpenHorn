[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` unlocks the multiwebview API (Window::add_child) used by the
# reply-reference preview panel's embedded browser (src/preview.rs).
tauri = { version = "2.10.3", features = ["devtools", "unstable"] }
tauri-plugin-log = "2"
# For spawning the OpenHorn sidecar binary as a Tauri sidecar process
# and for the workspace picker dialog.
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Cryptographically random handshake token for the sidecar handshake.
# rand::rngs::OsRng is backed by the platform CSPRNG on all OSes.
rand = "0.8"
# Parsing Codex CLI's MCP config (~/.codex/config.toml) during import.
toml = "0.8"
# Reading CC Switch's SQLite store (~/.cc-switch/cc-switch.db) during MCP
# import. `bundled` compiles SQLite in so there is no system dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
# Encoding non-UTF-8 skill resource files as base64 during skill import.
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Native WKWebView back/forward + canGoBack/canGoForward for the preview
# panel's embedded browser (src/preview.rs). Version matches what wry already
# pulls in (see Cargo.lock) so it is not compiled twice.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "WKWebView",
    "WKNavigation",
    # `takeSnapshotWithConfiguration:completionHandler:` — used to freeze the
    # last frame of a preview webview while a dialog covers it.
    "WKSnapshotConfiguration",
    "block2",
    "objc2-app-kit",
] }
# NSImage → NSBitmapImageRep → PNG bytes for the snapshot above.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
