# mini-trellis configuration; project package mapping retained during migration.
session_commit_message: 'chore: record journal'
max_journal_lines: 2000
session_auto_commit: false
packages:
  agent:
    path: packages/agent
  db:
    path: packages/db
  shared:
    path: packages/shared
  ui:
    path: packages/ui
  desktop:
    path: apps/desktop
  server:
    path: apps/server
  sidecar:
    path: apps/sidecar
  web:
    path: apps/web
default_package: agent
